<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<meta name="description" content="Dijimones: fan game gratis estilo Vampire Survivors con Digimon, en el navegador. Jugá solo o con amigos online.">
<meta name="theme-color" content="#121726">
<meta property="og:title" content="Dijimones">
<meta property="og:description" content="Sobreviví en el Digital World. Fan game gratis, solo o co-op online.">
<meta property="og:image" content="index.icon.png">
<title>Dijimones</title>
<link rel="icon" type="image/png" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
$GODOT_HEAD_INCLUDE
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121726; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: radial-gradient(ellipse at 50% 35%, #26355c 0%, #121726 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4f6ff;
    transition: opacity .5s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #logo { width: 132px; height: 132px; border-radius: 30px; image-rendering: pixelated;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
    animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0) } 45% { transform: translateY(-14px) } }
  #title { font-size: 46px; font-weight: 900; letter-spacing: 1px; color: #ff8f29;
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(0,0,0,.25); margin: 0; }
  #subtitle { margin: -14px 0 0; color: #a9b2cc; font-size: 15px; }
  #bar { width: min(340px, 70vw); height: 12px; border-radius: 99px; background: rgba(255,255,255,.08);
    overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  #fill { height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ff8f29, #ffc34d); transition: width .2s ease; }
  #status { font-size: 13px; color: #a9b2cc; min-height: 18px; }
  #note { position: fixed; bottom: 14px; font-size: 11px; color: #6c7593; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Tu navegador no soporta canvas.</canvas>
<div id="loader">
  <img id="logo" src="index.icon.png" alt="">
  <h1 id="title">DIJIMONES</h1>
  <p id="subtitle">Sobreviví en el Digital World</p>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Cargando el Digital World…</div>
  <div id="note">Fan game gratuito y no oficial. Digimon © Bandai Namco / Toei Animation / Akiyoshi Hongo.</div>
</div>
<script src="$GODOT_URL"></script>
<script>
  const GODOT_CONFIG = $GODOT_CONFIG;
  const loader = document.getElementById("loader");
  const fill = document.getElementById("fill");
  const status = document.getElementById("status");
  const tips = ["Saltá con Espacio para esquivar los golpes al piso", "Las Piedras Sagradas dan bonus para toda la run",
    "Con R disparás el especial cuando el anillo está lleno", "Creá una sala y jugá con hasta 3 amigos"];
  let tip = 0;
  const tipTimer = setInterval(() => { status.textContent = tips[tip++ % tips.length]; }, 2600);
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) {
    status.textContent = "Tu navegador no soporta: " + missing.join(", ");
  } else {
    const engine = new Engine(GODOT_CONFIG);
    engine.startGame({
      onProgress: (current, total) => { if (total > 0) fill.style.width = Math.min(100, current / total * 100) + "%"; },
    }).then(() => {
      clearInterval(tipTimer);
      fill.style.width = "100%";
      loader.classList.add("done");
      setTimeout(() => loader.remove(), 600);
      document.getElementById("canvas").focus();
    }, (err) => {
      clearInterval(tipTimer);
      status.textContent = "No se pudo cargar: " + err;
    });
  }
</script>
</body>
</html>
